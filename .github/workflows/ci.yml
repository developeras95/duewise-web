# Checks every push to main and every pull request in two steps:
#   1. Build and test: lint, formatting, unit and component tests with coverage, production build.
#   2. End to end: starts the whole stack with Docker Compose (PostgreSQL, the released Duewise API
#      from ghcr.io, and this app built from this commit behind nginx) and drives it with a real
#      browser (Playwright). Nothing is mocked.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

permissions:
  contents: read # the jobs only read the code

concurrency: # a newer push to the same branch cancels the older run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm # reuses downloaded packages between runs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit and component tests, with coverage
        run: npm run coverage -- --coverage.reporter=text-summary --coverage.reporter=json-summary --coverage.reporter=html

      - name: Write coverage to the run summary
        if: always()
        run: |
          f=coverage/coverage-summary.json
          if [ ! -f "$f" ]; then echo "No coverage report (the tests stopped before it)." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          node -e '
            const t = require("./" + process.argv[1]).total;
            const row = (name, m) => `| ${name} | ${m.pct}% (${m.covered} of ${m.total}) |`;
            console.log(["### Test coverage", "", "| Measure | Covered |", "| --- | --- |",
              row("Lines", t.lines), row("Branches", t.branches), row("Functions", t.functions)].join("\n"));
          ' "$f" >> "$GITHUB_STEP_SUMMARY"

      - name: Production build
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    name: End to end
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Duewise and the browser must agree on what "today" is.
      BUSINESS_TIME_ZONE: UTC
      E2E_TIME_ZONE: UTC

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies and the browser
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait until Duewise answers through the app
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/actuator/health | grep -q '"status":"UP"'; then
              echo "Up after about $((i * 3)) seconds"; exit 0
            fi
            sleep 3
          done
          echo "::error::Duewise did not come up within 3 minutes"
          docker compose ps
          exit 1

      - name: Run the end-to-end tests
        run: npm run e2e

      - name: Show the containers' logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        run: docker compose down -v
